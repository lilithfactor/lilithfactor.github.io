name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Fired by the content sync once it has committed new content/*.json.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress ones are cancelled, so the newest
# push always wins rather than an older build landing last.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ensures Pages is enabled with source = GitHub Actions (flips the repo
      # from any legacy branch-based Pages config on first run).
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
