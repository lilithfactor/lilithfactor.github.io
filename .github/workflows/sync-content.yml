name: Sync content

# Notion is the dashboard; this is the wire. Three triggers:
#   schedule  — the guarantee (every 30 min)
#   dispatch  — the speed (runnable from the GitHub mobile app, or a Notion
#               automation webhook via repository_dispatch)
# This workflow CALLS deploy.yml when it commits. It used to rely on the push
# to main triggering deploy.yml on its own, which never once worked: GitHub
# refuses to trigger a workflow from a push made with the default GITHUB_TOKEN,
# deliberately, so that a workflow cannot loop by committing. The sync happily
# committed every half hour, printed "deploy.yml will publish it", and nothing
# published. The site served 2026-08-13 content until 2026-09-17.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [notion-changed]

# contents: write to commit the sync. The other two are for deploy.yml, which
# this workflow calls: a called workflow gets the CALLER's permissions, so
# leaving them out here makes the deploy fail on a token it cannot use.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-content
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Whether anything actually changed, so the deploy below can skip the ~27
    # runs a day where Notion was untouched.
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # No npm ci: the sync uses only node builtins (raw fetch), so installing
      # the whole toolchain to run it would be pure latency.
      - name: Sync from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/sync-notion.mjs

      - name: Commit if content changed
        id: commit
        run: |
          set -euo pipefail
          # -I ignores lines matching the regex: meta.json's syncedAt changes on
          # EVERY run, which made every half-hour cron commit "changes" that were
          # only a timestamp — polluting history and conflicting with any local
          # rebase. Real content changes still commit (meta rides along).
          if git diff --quiet -I '"syncedAt"' -- content/; then
            echo "No content changes (timestamp-only)."
            git checkout -- content/
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/
          # Subject is filtered out of release notes — see brain/work/releases.md.
          git commit -m "Sync content from Notion"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Keeps the plant's like counter awake. A free Supabase project pauses
      # after about a week idle; this workflow already runs every 30 minutes,
      # so a HEAD on one row is the cheapest possible insurance and needs no
      # schedule of its own. See docs/likes.md.
      #
      # It does nothing at all when the variables are unset, and cannot fail
      # the run when it is set: a sleeping plant must never be the reason
      # content stops deploying.
      - name: Keep the plant's database awake
        if: vars.PUBLIC_SUPABASE_URL != ''
        continue-on-error: true
        run: |
          curl -sS -I -o /dev/null \
            -H "apikey: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}" \
            "${{ vars.PUBLIC_SUPABASE_URL }}/rest/v1/plant?select=likes&limit=1"

  # The half of this that was missing. Calling deploy.yml is the only way a
  # bot-authored commit reaches the site.
  publish:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
