# The like counter. See README.md — it assumes you have never used Wrangler.
#
# NOTHING SECRET IS IN THIS FILE and nothing secret ever goes in it: it is
# committed. The two secrets are set with `wrangler secret put`, which stores
# them on Cloudflare and never writes them to disk. Everything below is public
# by nature — a name, a date, and the origin allowed to call this.

name = "desk-likes"
main = "worker.js"
# Pins the Workers runtime behaviour to what this file was written against.
# Bumping it is a deliberate change, the same way the Notion API version is.
compatibility_date = "2026-01-01"

# The number itself, and the per-address rate limit, live here.
# Replace the id with the one `wrangler kv namespace create LIKES` prints.
[[kv_namespaces]]
binding = "LIKES"
id = "PUT_YOUR_KV_NAMESPACE_ID_HERE"

[vars]
# The ONLY origin allowed to call this endpoint. Not a wildcard: a wildcard
# lets any page on the internet spend a visitor's one like per day. Add more
# origins comma-separated if a preview deploy needs one.
ALLOW_ORIGIN = "https://lilithfactor.github.io"

# The name of the number property on the Notion page, exactly as it is spelled
# in Notion. Not a secret — it is a column heading.
NOTION_PROPERTY = "Likes"
